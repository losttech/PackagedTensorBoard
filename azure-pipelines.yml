name: '$(Date:yyyyMMdd)$(Rev:-rr)'

trigger: none
# - master

strategy:
  matrix:
    Linux:
      imageName: 'ubuntu-latest'
    MacOS:
      # x64 (Intel) image: the packaged runtime is osx-x64, and TensorFlow
      # no longer publishes macOS x86_64 builds after 2.15.1
      imageName: 'macos-13'
    Windows:
      imageName: 'windows-latest'

pool:
  vmImage: $(imageName)

steps:
- task: UseDotNet@2
  displayName: 'Setup SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'
- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'
    feedsToUse: 'select'
    vstsFeed: '6ea7f709-397d-481c-a895-bf3cf16ec737'
- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
- task: DotNetCoreCLI@2
  displayName: 'Test'
  inputs:
    command: 'test'
    projects: 'test/**/*.csproj'
- task: DotNetCoreCLI@2
  displayName: 'Pack'
  condition: and(succeeded(), eq(variables['imageName'], 'windows-latest'))
  inputs:
    command: 'custom'
    projects: 'src/**/*.csproj'
    custom: 'pack'
    arguments: '--version-suffix CI-$(Build.BuildNumber) -o $(Build.ArtifactStagingDirectory)'
- task: NuGetCommand@2
  displayName: 'Push'
  condition: and(succeeded(), eq(variables['imageName'], 'windows-latest'))
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
    nuGetFeedType: 'internal'
    publishVstsFeed: '6ea7f709-397d-481c-a895-bf3cf16ec737'
